<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Happyfilms — สต็อกอัตโนมัติ</title><link rel="stylesheet" href="/assets/styles.css"></head><body><main class="shell section"><a href="/admin">← แดชบอร์ดเดิม</a><h1>สต็อกส่งอัตโนมัติ</h1><p>ใช้บัญชีแอดมินเดิม สต็อกจะถูกเข้ารหัสและส่งให้ลูกค้าเมื่อยืนยันการชำระเงินเท่านั้น</p><form id="import"><label>สินค้า<select id="product"></select></label><label>แพ็ก<select id="variant"></select></label><label>ข้อมูลสำหรับส่งลูกค้า (หนึ่งรายการต่อบรรทัด)<textarea id="credentials" rows="10" required autocomplete="off"></textarea></label><button type="submit" class="btn btn-primary">นำเข้าสต็อก</button></form><p id="status" role="status"></p><pre id="health"></pre><h2>คำสั่งซื้ออัตโนมัติ</h2><button id="orders">โหลดรายการ</button><pre id="order-list"></pre><h2>ขั้นตอนการซื้อ</h2><p>นับเหตุการณ์จากเบราว์เซอร์แบบไม่ระบุตัวตน ไม่ใช่ยอดขายหรือยอดชำระเงินจริง</p><button id="metrics">ดูจำนวนแต่ละขั้นตอน</button><pre id="metric-list"></pre><h2>สุขภาพระบบและสิ่งที่ต้องจัดการ</h2><button id="ops">อัปเดตสถานะ</button><div id="ops-actions"></div><pre id="ops-status"></pre></main><script src="/assets/hf-stock-admin.js" defer></script></body></html>
